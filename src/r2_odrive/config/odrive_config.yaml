odrive_controller_node:
  ros__parameters:
    # Topic to subscribe to for motor speed commands
    speed_command_topic: "/motor_speeds"

    # ODrive connection settings
    connection_type: "usb"
    connection_timeout: 5.0
    max_reconnect_attempts: 1

    # Motor configurations - 3 motors defined as separate arrays
    # All arrays must have the same length (number of motors)
    motor_serials: ["20773881304E", "20773881304E", "385F3388304E"]  # ODrive serial numbers
    motor_axes: [0, 1, 0]  # Axis number for each motor (0 or 1)
    motor_names: ["motor_1", "motor_2", "motor_3"]  # Descriptive names
    motor_speed_multipliers: [1.0, 1.0, 1.0]  # Speed multipliers

    # Control mode: "velocity" or "position"
    control_mode: "velocity"

    # Watchdog timer settings - stops motors if no commands received
    command_timeout: 1.0 # seconds
    enable_watchdog: false
